<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second-brain-pwa</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            color: #1a202c;
        }
        .header-bg {
            background-color: #fff;
        }
        .btn-primary {
            background-color: #6574cd;
            border-color: #6574cd;
        }
        .btn-primary:hover {
            background-color: #4c51bf;
            border-color: #4c51bf;
        }
    </style>
</head>
<body class="font-sans leading-normal tracking-normal">

<header class="header-bg shadow-md">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Second-brain-pwa</h1>
        <!-- Přidejte tady hlavní navigaci, pokud potřebujete -->
    </div>
</header>

<main class="container mx-auto px-6 py-8">
    <section class="bg-white shadow-md rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Vítejte v Second-brain-pwa</h2>
        <p class="mb-4">Zde můžete spravovat své poznámky a úkoly.</p>
    </section>

    <section class="bg-white shadow-md rounded-lg p-6 mb-6">
        <h3 class="text-lg font-bold mb-4">Vaše poznámky</h3>
        <!-- Příklad komponenty pro zobrazení poznámek -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
                <p class="font-semibold">Poznámka 1</p>
                <p>Obsah poznámky...</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
                <p class="font-semibold">Poznámka 2</p>
                <p>Obsah poznámky...</p>
            </div>
        </div>
    </section>

    <section class="bg-white shadow-md rounded-lg p-6 mb-6">
        <h3 class="text-lg font-bold mb-4">Vaše úkoly</h3>
        <!-- Příklad komponenty pro zobrazení úkolů -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-50 p-4 rounded-lg shadow-sm flex items-center justify-between">
                <p>Úkol 1</p>
                <button class="btn-primary text-white px-3 py-1 rounded-full">Hotovo</button>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg shadow-sm flex items-center justify-between">
                <p>Úkol 2</p>
                <button class="btn-primary text-white px-3 py-1 rounded-full">Hotovo</button>
            </div>
        </div>
    </section>
</main>

<footer class="footer-bg bg-gray-800 text-white py-4">
    <div class="container mx-auto px-6 text-center">
        &copy; 2023 Second-brain-pwa. Všechna práva vyhrazena.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2/dist/alpine.min.js" defer></script>
</body>
</html>
